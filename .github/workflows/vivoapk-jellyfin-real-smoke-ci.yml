name: VivoAPK Jellyfin 12.4 disposable server integration
on:
  push:
    paths:
      - "jellyfin-auth/**"
      - "backend/app/private_media_api.py"
      - "backend/app/services/private_ts.py"
      - "backend/app/services/media_origin.py"
      - "backend/app/services/catalog.py"
      - "backend/app/config.py"
      - "backend/tests/synthetic_ts_origin.py"
      - "infra/native_release_manifest.py"
      - ".github/workflows/vivoapk-jellyfin-real-smoke-ci.yml"
  pull_request:
    paths:
      - "jellyfin-auth/**"
      - "backend/app/private_media_api.py"
      - "backend/app/services/private_ts.py"
      - "backend/app/services/media_origin.py"
      - "backend/app/services/catalog.py"
      - "backend/app/config.py"
      - "backend/tests/synthetic_ts_origin.py"
      - "infra/native_release_manifest.py"
      - ".github/workflows/vivoapk-jellyfin-real-smoke-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vivoapk_fixture
          POSTGRES_PASSWORD: disposable-native-fixture-only
          POSTGRES_DB: vivoapk_native_private_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vivoapk_fixture -d vivoapk_native_private_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VIVOAPK_NATIVE_PRIVATE_DATABASE_URL: postgresql+psycopg://vivoapk_fixture:disposable-native-fixture-only@127.0.0.1:5432/vivoapk_native_private_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build original VivoAPK plugin against Jellyfin 12.4
        run: dotnet build jellyfin-auth/Vivoapk.Jellyfin.Auth/Vivoapk.Jellyfin.Auth.csproj -c Release
      - name: Download test-only Jellyfin 12.4 binaries (no VPS changes)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jellyfin-test-bin" "$RUNNER_TEMP/jellyfin-test-web"
          curl -fsSL --retry 2 --max-time 300             'https://repo.jellyfin.org/files/server/linux/latest-stable/amd64/jellyfin_12.4-amd64.tar.gz'             -o "$RUNNER_TEMP/jellyfin-server.tar.gz"
          curl -fsSL --retry 2 --max-time 300             'https://repo.jellyfin.org/files/server/ubuntu/latest-stable/amd64/jellyfin-web_12.4+ubu2404_all.deb'             -o "$RUNNER_TEMP/jellyfin-web.deb"
          tar -xzf "$RUNNER_TEMP/jellyfin-server.tar.gz" -C "$RUNNER_TEMP/jellyfin-test-bin"
          dpkg-deb -x "$RUNNER_TEMP/jellyfin-web.deb" "$RUNNER_TEMP/jellyfin-test-web"
          file="$(find "$RUNNER_TEMP/jellyfin-test-bin" -maxdepth 5 -type f -name jellyfin -perm /111 -print -quit)"
          test -n "$file"
          test -s "$RUNNER_TEMP/jellyfin-test-web/usr/share/jellyfin/web/index.html"
          echo "JELLYFIN_TEST_BINARY=$file" >> "$GITHUB_ENV"
          echo "JELLYFIN_TEST_WEB=$RUNNER_TEMP/jellyfin-test-web/usr/share/jellyfin/web" >> "$GITHUB_ENV"
          echo JELLYFIN_TEST_RUNTIME_READY=PASS
      - name: Build proposed upstream catalogue fix on exact Jellyfin 12.4 source (lab only)
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/jellyfin-catalog-source"
          mkdir -p "$source_dir"
          git -C "$source_dir" init -q
          git -C "$source_dir" fetch --depth=1 https://github.com/jellyfin/jellyfin.git refs/tags/v12.4
          test "$(git -C "$source_dir" rev-parse FETCH_HEAD)" = "83d0d0e7f76e23e2e085c8ff67d28b772d35967d"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" hash-object src/Jellyfin.LiveTv/Channels/ChannelManager.cs)" = "256a652fd2b13f87d83049bfede12426013dce82"
          # Reviewed upstream PR #18231 at 305190fced103cc9cba3f577c56ea607e6feea76.
          patch="$GITHUB_WORKSPACE/jellyfin-auth/tests/upstream-jellyfin-18231.patch"
          git -C "$source_dir" apply --check "$patch"
          git -C "$source_dir" apply "$patch"
          git -C "$source_dir" diff --check
          # Read the real installed assembly metadata before setting any version property.
          runtime_dir="$(dirname "$(realpath "$JELLYFIN_TEST_BINARY")")"
          case "$runtime_dir/" in "$RUNNER_TEMP"/jellyfin-test-bin/*) ;; *) exit 1 ;; esac
          original="$runtime_dir/Jellyfin.LiveTv.dll"
          test -s "$original"
          identity_dir="$RUNNER_TEMP/jellyfin-assembly-identity"
          dotnet new console --no-restore -n AssemblyIdentity -f net10.0 -o "$identity_dir"
          cp "$GITHUB_WORKSPACE/jellyfin-auth/tests/assembly_identity.cs" "$identity_dir/Program.cs"
          dotnet build "$identity_dir/AssemblyIdentity.csproj" -c Release --nologo
          identity_tool="$identity_dir/bin/Release/net10.0/AssemblyIdentity.dll"
          dotnet "$identity_tool" show "$original"
          assembly_version="$(dotnet "$identity_tool" version "$original")"
          file_version="$(dotnet "$identity_tool" file-version "$original")"
          [[ "$assembly_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$file_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # Previous diagnostic confirmed SDK default 1.0.0.0 vs official 12.0.0.0.
          # Scope version settings to LiveTv only, before the first build.
          # Never rebuild the dependency graph into a shared output directory.
          project="$source_dir/src/Jellyfin.LiveTv/Jellyfin.LiveTv.csproj"
          python3 - "$project" "$assembly_version" "$file_version" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          old = "<TargetFramework>net10.0</TargetFramework>"
          source = p.read_text()
          assert source.count(old) == 1 and "<AssemblyVersion>" not in source
          p.write_text(source.replace(old, old + "\n    <AssemblyVersion>" + sys.argv[2]
              + "</AssemblyVersion>\n    <FileVersion>" + sys.argv[3] + "</FileVersion>"))
          PY
          git -C "$source_dir" diff --check
          (
            cd "$source_dir"
            dotnet test tests/Jellyfin.LiveTv.Tests/Jellyfin.LiveTv.Tests.csproj -c Release --filter 'FullyQualifiedName~ChannelManagerTests'
          )
          # The test project directly references LiveTv. Use exactly its tested DLL.
          candidate="$source_dir/src/Jellyfin.LiveTv/bin/Release/net10.0/Jellyfin.LiveTv.dll"
          tested="$source_dir/tests/Jellyfin.LiveTv.Tests/bin/Release/net10.0/Jellyfin.LiveTv.dll"
          test -s "$candidate"
          test -s "$tested"
          cmp "$candidate" "$tested"
          dotnet "$identity_tool" verify "$original" "$candidate" "$runtime_dir"
          # Replace only the affected assembly in the disposable official binary tree.
          cp "$runtime_dir/Jellyfin.LiveTv.dll" "$RUNNER_TEMP/Jellyfin.LiveTv.original.dll"
          install -m 0644 "$candidate" "$runtime_dir/Jellyfin.LiveTv.dll"
          sha256sum "$RUNNER_TEMP/Jellyfin.LiveTv.original.dll" "$runtime_dir/Jellyfin.LiveTv.dll"
          echo JELLYFIN_UPSTREAM_18231_LAB_BUILD=PASS
      - name: Compile and verify exact finite HLS tail seek (disposable server only)
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/jellyfin-catalog-source"
          runtime_dir="$(dirname "$(realpath "$JELLYFIN_TEST_BINARY")")"
          case "$runtime_dir/" in "$RUNNER_TEMP"/jellyfin-test-bin/*) ;; *) exit 1 ;; esac
          original="$runtime_dir/MediaBrowser.Controller.dll"
          test -s "$original"
          identity_tool="$RUNNER_TEMP/jellyfin-assembly-identity/bin/Release/net10.0/AssemblyIdentity.dll"
          python3 "$GITHUB_WORKSPACE/jellyfin-auth/tests/prepare_tail_seek.py" "$source_dir"
          git -C "$source_dir" diff --check
          (
            cd "$source_dir"
            dotnet test tests/Jellyfin.Controller.Tests/Jellyfin.Controller.Tests.csproj -c Release --filter 'FullyQualifiedName~EncodingHelperTests'
          )
          candidate="$source_dir/MediaBrowser.Controller/bin/Release/net10.0/MediaBrowser.Controller.dll"
          tested="$source_dir/tests/Jellyfin.Controller.Tests/bin/Release/net10.0/MediaBrowser.Controller.dll"
          test -s "$candidate"
          test -s "$tested"
          cmp "$candidate" "$tested"
          dotnet "$identity_tool" verify "$original" "$candidate" "$runtime_dir"
          cp "$original" "$RUNNER_TEMP/MediaBrowser.Controller.original.dll"
          install -m 0644 "$candidate" "$original"
          sha256sum "$RUNNER_TEMP/MediaBrowser.Controller.original.dll" "$original"
          echo JELLYFIN_EXACT_FINITE_HLS_TAIL_LAB_BUILD=PASS
      - name: Compile and verify native live HLS sliding window (disposable server only)
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/jellyfin-catalog-source"
          runtime_dir="$(dirname "$(realpath "$JELLYFIN_TEST_BINARY")")"
          case "$runtime_dir/" in "$RUNNER_TEMP"/jellyfin-test-bin/*) ;; *) exit 1 ;; esac
          original="$runtime_dir/Jellyfin.Api.dll"
          test -s "$original"
          identity_tool="$RUNNER_TEMP/jellyfin-assembly-identity/bin/Release/net10.0/AssemblyIdentity.dll"
          assembly_version="$(dotnet "$identity_tool" version "$original")"
          file_version="$(dotnet "$identity_tool" file-version "$original")"
          python3 "$GITHUB_WORKSPACE/jellyfin-auth/tests/prepare_live_window.py" "$source_dir" "$assembly_version" "$file_version"
          git -C "$source_dir" diff --check
          (
            cd "$source_dir"
            dotnet test tests/Jellyfin.Api.Tests/Jellyfin.Api.Tests.csproj -c Release --filter 'FullyQualifiedName~DynamicHlsControllerTests'
          )
          candidate="$source_dir/Jellyfin.Api/bin/Release/net10.0/Jellyfin.Api.dll"
          tested="$source_dir/tests/Jellyfin.Api.Tests/bin/Release/net10.0/Jellyfin.Api.dll"
          test -s "$candidate"
          test -s "$tested"
          cmp "$candidate" "$tested"
          dotnet "$identity_tool" verify "$original" "$candidate" "$runtime_dir"
          cp "$original" "$RUNNER_TEMP/Jellyfin.Api.original.dll"
          install -m 0644 "$candidate" "$original"
          sha256sum "$RUNNER_TEMP/Jellyfin.Api.original.dll" "$original"
          echo JELLYFIN_LIVE_WINDOW_LAB_BUILD=PASS
      - name: Compare official Jellyfin FFmpeg 8.1.3 on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/jellyfin-ffmpeg-8.1.3-2.tar.xz"
          dir="$RUNNER_TEMP/jellyfin-official-ffmpeg"
          mkdir -p "$dir"
          curl -fsSL --retry 2 --max-time 240 'https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v8.1.3-2/jellyfin-ffmpeg_8.1.3-2_portable_linux64-gpl.tar.xz' -o "$archive"
          echo "1df84d04c4322902dba81c290508cdf3d89524d210b9fe03154bea6c4e3bfbb6  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$dir"
          ffmpeg_bin="$(find "$dir" -maxdepth 5 -type f -name ffmpeg -perm /111 -print -quit)"
          test -n "$ffmpeg_bin"
          bin_dir="$(dirname "$ffmpeg_bin")"
          test -x "$bin_dir/ffprobe"
          "$ffmpeg_bin" -version | sed -n '1p'
          "$bin_dir/ffprobe" -version | sed -n '1p'
          "$ffmpeg_bin" -hide_banner -encoders 2>/dev/null | grep 'libx264' >/dev/null
          # The unchanged smoke script resolves ffmpeg/ffprobe from PATH.
          # No global apt install and no fallback to the Ubuntu binary.
          echo "$bin_dir" >> "$GITHUB_PATH"
          echo "VIVOAPK_EXPECTED_FFMPEG=$ffmpeg_bin" >> "$GITHUB_ENV"
          echo JELLYFIN_TEST_FFMPEG_OFFICIAL_DIGEST=PASS
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install disposable private backend fixtures
        run: python -m pip install --disable-pip-version-check './backend[dev]'
      - name: Run real Jellyfin 12.4 server with a fake local Mega backend
        shell: bash
        run: |
          set -euo pipefail
          test "$(command -v ffmpeg)" = "$VIVOAPK_EXPECTED_FFMPEG"
          test "$(command -v ffprobe)" = "$(dirname "$VIVOAPK_EXPECTED_FFMPEG")/ffprobe"
          ffmpeg -version | sed -n '1p'
          sudo install -d -m 0755 /srv/projects/Vivoapk/run
          sudo chown -R "$(id -u):$(id -g)" /srv/projects/Vivoapk
          python3 -m py_compile jellyfin-auth/tests/jellyfin_12_4_smoke.py jellyfin-auth/tests/catalog_concurrency_probe.py
          mkdir -p "$RUNNER_TEMP/vivoapk-ci-diagnostics"
          failed=0
          run_gate() {
            local gate="$1"
            shift
            if "$@" | tee "$RUNNER_TEMP/vivoapk-ci-diagnostics/$gate.log"; then
              echo "VIVOAPK_INDEPENDENT_GATE=$gate:PASS"
            else
              echo "VIVOAPK_INDEPENDENT_GATE=$gate:FAIL"
              failed=1
            fi
          }
          # Before any release work, certify the combined LiveTv + API patches against
          # the same complete suite. Earlier five-gate and infinite-live approvals
          # came from different builds. Nothing in this runner is installable.
          evidence="$RUNNER_TEMP/vivoapk-ci-diagnostics/candidate-identity.log"
          runtime_dir="$(dirname "$(realpath "$JELLYFIN_TEST_BINARY")")"
          plugin="jellyfin-auth/Vivoapk.Jellyfin.Auth/bin/Release/net10.0/Jellyfin.Plugin.VivoapkMegaAuth.dll"
          {
            echo "SOURCE_COMMIT=$GITHUB_SHA"
            echo "SCOPE=DISPOSABLE_LAB_ONLY_NOT_PRODUCTION"
            echo "REGULAR_PLUGIN_SHA256=$(sha256sum "$plugin" | cut -d ' ' -f1)"
            echo "PATCHED_LIVETV_SHA256=$(sha256sum "$runtime_dir/Jellyfin.LiveTv.dll" | cut -d ' ' -f1)"
            echo "PATCHED_API_SHA256=$(sha256sum "$runtime_dir/Jellyfin.Api.dll" | cut -d ' ' -f1)"
            echo "PATCHED_CONTROLLER_SHA256=$(sha256sum "$runtime_dir/MediaBrowser.Controller.dll" | cut -d ' ' -f1)"
            echo "FFMPEG_SHA256=$(sha256sum "$VIVOAPK_EXPECTED_FFMPEG" | cut -d ' ' -f1)"
          } | tee "$evidence"
          # Preserve the exact regular assembly and the three tested upstream
          # assemblies BEFORE any fixture-symbol rebuild. A later rebuild is
          # not the artifact tested here. Publish only after all nine gates pass.
          bundle="$RUNNER_TEMP/vivoapk-native-candidate"
          install -d -m 0700 "$bundle"
          install -m 0644 "$plugin" "$bundle/Jellyfin.Plugin.VivoapkMegaAuth.dll"
          for dll in Jellyfin.Api.dll Jellyfin.LiveTv.dll MediaBrowser.Controller.dll; do
            install -m 0644 "$runtime_dir/$dll" "$bundle/$dll"
          done
          install -m 0644 jellyfin-auth/Vivoapk.Jellyfin.Auth/meta.json "$bundle/meta.json"
          run_gate standard python3 -u jellyfin-auth/tests/jellyfin_12_4_smoke.py
          run_gate category env VIVOAPK_CI_CATEGORY_MODE=1 python3 -u jellyfin-auth/tests/jellyfin_12_4_smoke.py
          mkdir -p "$RUNNER_TEMP/catalog-race"
          run_gate catalog-race env RUNNER_TEMP="$RUNNER_TEMP/catalog-race" VIVOAPK_CI_CATEGORY_MODE=1 python3 -u jellyfin-auth/tests/catalog_concurrency_probe.py
          # Prove private playback using the same ordinary plugin DLL as
          # standard/category, with host opt-in and synthetic socket only.
          # Do not rebuild with the fixture symbol until these gates end.
          grep -Fx "REGULAR_PLUGIN_SHA256=$(sha256sum "$plugin" | cut -d ' ' -f1)" "$evidence"
          run_gate regular-private-hls env VIVOAPK_CI_REGULAR_PRIVATE=1 VIVOAPK_CI_CATEGORY_MODE=1 VIVOAPK_CI_SERVER_PLAYBACK=1 VIVOAPK_CI_PRIVATE_HLS=1 python3 -u jellyfin-auth/tests/jellyfin_12_4_smoke.py
          run_gate regular-private-file env VIVOAPK_CI_REGULAR_PRIVATE=1 VIVOAPK_CI_CATEGORY_MODE=1 VIVOAPK_CI_SERVER_PLAYBACK=1 VIVOAPK_CI_PRIVATE_HLS=1 VIVOAPK_CI_PRIVATE_FILE=1 python3 -u jellyfin-auth/tests/jellyfin_12_4_smoke.py
          run_gate regular-private-live-recovery env VIVOAPK_CI_REGULAR_PRIVATE=1 VIVOAPK_CI_CATEGORY_MODE=1 VIVOAPK_CI_SERVER_PLAYBACK=1 VIVOAPK_CI_PRIVATE_HLS=1 VIVOAPK_CI_PRIVATE_LIVE=1 python3 -u jellyfin-auth/tests/jellyfin_12_4_smoke.py
          mkdir -p "$RUNNER_TEMP/private-ts"
          run_gate regular-private-ts-recovery env RUNNER_TEMP="$RUNNER_TEMP/private-ts" VIVOAPK_CI_PRIVATE_TS=1 VIVOAPK_CI_REGULAR_PRIVATE=1 VIVOAPK_CI_CATEGORY_MODE=1 VIVOAPK_CI_SERVER_PLAYBACK=1 VIVOAPK_CI_PRIVATE_HLS=1 VIVOAPK_CI_PRIVATE_LIVE=1 python3 -u jellyfin-auth/tests/jellyfin_12_4_smoke.py
          dotnet build jellyfin-auth/Vivoapk.Jellyfin.Auth/Vivoapk.Jellyfin.Auth.csproj -c Release -t:Rebuild -p:NativePlaybackLabBuild=true
          echo "SYNTHETIC_PLUGIN_SHA256=$(sha256sum "$plugin" | cut -d ' ' -f1)" | tee -a "$evidence"
          if (( failed != 0 )); then
            echo "PRIVATE_HLS_GATE_FAILED_BEFORE_REMAINING_NATIVE_REGRESSION=1" | tee -a "$evidence"
            exit "$failed"
          fi
          run_gate native-server-ffmpeg env VIVOAPK_CI_CATEGORY_MODE=1 VIVOAPK_CI_SERVER_PLAYBACK=1 python3 -u jellyfin-auth/tests/jellyfin_12_4_smoke.py
          run_gate native-long-cache env VIVOAPK_CI_CATEGORY_MODE=1 VIVOAPK_CI_SERVER_PLAYBACK=1 VIVOAPK_CI_LONG_CACHE=1 python3 -u jellyfin-auth/tests/jellyfin_12_4_smoke.py
          run_gate native-infinite-live env VIVOAPK_CI_CATEGORY_MODE=1 VIVOAPK_CI_SERVER_PLAYBACK=1 VIVOAPK_CI_INFINITE_LIVE=1 python3 -u jellyfin-auth/tests/jellyfin_12_4_smoke.py
          echo "COMBINED_LAB_GATE_EXIT=$failed" | tee -a "$evidence"
          if (( failed != 0 )); then exit "$failed"; fi
          # The candidate manifest is evidence, NOT approval to install.
          python3 infra/native_release_manifest.py "$bundle" "$evidence" \
            "$VIVOAPK_EXPECTED_FFMPEG" "$(dirname "$VIVOAPK_EXPECTED_FFMPEG")/ffprobe" \
            "$GITHUB_SHA" "$GITHUB_RUN_ID"
      - name: Preserve exact ordinary-plugin candidate after all integrated gates
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vivoapk-native-regular-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/vivoapk-native-candidate/
          if-no-files-found: error
          retention-days: 14
      - name: Save synthetic-only player compatibility observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vivoapk-disposable-jellyfin-direct-play-diagnostics
          path: ${{ runner.temp }}/vivoapk-ci-diagnostics/*.log
          retention-days: 7

