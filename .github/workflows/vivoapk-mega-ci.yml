name: Vivoapk Mega OTT - synthetic backend tests
on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/vivoapk-mega-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/vivoapk-mega-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"
      - name: Syntax and unit tests (fixtures only)
        env:
          APP_ENV: test
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          SESSION_SIGNING_KEY: "test-signing-key-32-bytes-minimum-value"
        run: |
          python -m compileall -q app tests
          python -m pytest -q
